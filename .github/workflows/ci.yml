name: CI

on:
  push:
  pull_request:

jobs:
  database-validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate schema and tests
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres sigm_ci
          psql -h localhost -U postgres -d sigm_ci -v ON_ERROR_STOP=1 -f database/run_all.sql
          psql -h localhost -U postgres -d sigm_ci -v ON_ERROR_STOP=1 -f database/run_all.sql >/dev/null
          for t in database/tests/*.sql; do echo "== $t"; psql -h localhost -U postgres -d sigm_ci -v ON_ERROR_STOP=1 -f "$t"; done

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore/Build/Test
        run: |
          dotnet restore backend/SIGM.slnx
          dotnet build backend/SIGM.slnx -c Release --no-restore
          dotnet test backend/SIGM.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx" || true

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [clinic-portal, practice-portal, patient-portal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build
        working-directory: frontend/${{ matrix.app }}
        run: |
          npm ci || npm install
          npm run build
